<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Liteda</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0a0a0a;
      color: #e4e4e7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 500px;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      opacity: 0.5;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #fafafa;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #a1a1aa;
      margin-bottom: 2rem;
    }

    .button {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #27272a;
      color: #fafafa;
      text-decoration: none;
      border-radius: 0.5rem;
      border: 1px solid #3f3f46;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
    }

    .button:hover {
      background: #3f3f46;
      border-color: #52525b;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2rem;
      padding: 0.5rem 1rem;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      color: #71717a;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.3;
      }
    }

    .online .status-dot {
      background: #22c55e;
      animation: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3"/>
    </svg>

    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection.
      Your dashboard will be available again once you're back online.
    </p>

    <button class="button" onclick="tryReconnect()">Try Again</button>

    <div class="status" id="status">
      <span class="status-dot"></span>
      <span>Offline</span>
    </div>
  </div>

  <script>
    function updateStatus() {
      const status = document.getElementById('status');
      if (navigator.onLine) {
        status.innerHTML = '<span class="status-dot"></span><span>Online</span>';
        status.classList.add('online');
      } else {
        status.innerHTML = '<span class="status-dot"></span><span>Offline</span>';
        status.classList.remove('online');
      }
    }

    function tryReconnect() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        alert('Still offline. Please check your internet connection.');
      }
    }

    // Monitor connection status
    window.addEventListener('online', () => {
      updateStatus();
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    });

    window.addEventListener('offline', updateStatus);

    // Initial status check
    updateStatus();

    // Auto-retry every 10 seconds
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 10000);
  </script>
</body>
</html>
