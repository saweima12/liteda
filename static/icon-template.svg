<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0a0a" rx="80"/>

  <!-- Gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon design - Dashboard/Grid pattern -->
  <g fill="url(#grad)">
    <!-- Top left square -->
    <rect x="100" y="100" width="120" height="120" rx="16"/>

    <!-- Top right square -->
    <rect x="292" y="100" width="120" height="120" rx="16"/>

    <!-- Bottom left square -->
    <rect x="100" y="292" width="120" height="120" rx="16"/>

    <!-- Bottom right square (highlighted) -->
    <rect x="292" y="292" width="120" height="120" rx="16" fill="#fbbf24"/>
  </g>

  <!-- Letter L (Liteda) - optional, comment out if not desired -->
  <!--
  <text x="256" y="320" font-family="Inter, Arial, sans-serif"
        font-size="200" font-weight="700" fill="white"
        text-anchor="middle" dominant-baseline="middle">L</text>
  -->
</svg>
