# yaml-language-server: $schema=./schemas/services.schema.json

# Home Page Services
# Example: Nested groups with columns (groups arranged in grid)
- name: Infrastructure
  icon: openldap
  columns: 2  # 2 groups side by side
  groups:
    - name: Monitoring
      columns: 1
      type: compact
      items:
        - name: Grafana
          icon: grafana
          url: https://grafana.local
          description: Metrics dashboard
        - name: Prometheus
          icon: prometheus
          url: https://prometheus.local
          description: Monitoring system
    - name: Management
      columns: 1
      items:
        - name: Portainer
          icon: portainer
          url: https://portainer.local
          description: Container management
        - name: Proxmox
          icon: proxmox
          url: https://pve.local
          description: Virtualization platform

# Example: Flat group with items
- name: Quick Access
  columns: 2
  items:
    - name: Demo Widget
      icon: shoko-server
      description: Demo widget example
      widget:
        type: demo
        interval: 10000
        # Server-side only variables (never exposed to browser)
        vars:
          apiKey: "your-secret-api-key"
          endpoint: "https://api.example.com/status"

    - name: GitHub
      icon: github
      # statuscheck: true
      url: https://github.com
      description: Code repository

    - name: GitLab
      icon: gitlab
      # statuscheck: true
      url: https://gitlab.com
      description: DevOps platform

    - name: Docker Hub
      icon: docker
      url: https://hub.docker.com
      description: Container registry

- name: Docker Containers
  icon: docker
  type: docker-group
  vars:
    refreshInterval: 30000
    columns: 3
    # Optional: URL template for container links
    # Tokens: {name}, {id}, {image}, {state}
    # urlTemplate: "http://localhost:8080/{name}"
    # Optional: Filter by labels
    # includeLabels:
    #   - "homepage.enable=true"
    # excludeLabels:
    #   - "homepage.hide=true"

- name: Tools
  type: compact
  items:
    - name: Excalidraw
      icon: excalidraw
      url: https://excalidraw.com
      description: Virtual whiteboard

    - name: Regex101
      url: https://regex101.com
      description: Regex tester

    - name: JSON Formatter
      url: https://jsonformatter.org
      description: JSON tools

# Example: Bookmarks (tags style)
- name: Quick Links
  type: bookmarks
  items:
    - name: Google
      url: https://google.com
      icon: google
    - name: YouTube
      url: https://youtube.com
      icon: youtube
    - name: Reddit
      url: https://reddit.com
      icon: reddit
    - name: Hacker News
      url: https://news.ycombinator.com
      icon: hacker-news
    - name: SvelteKit Docs
      url: https://kit.svelte.dev/docs
      icon: svelte
    - name: Tailwind CSS
      url: https://tailwindcss.com/docs
      icon: css
