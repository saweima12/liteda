# yaml-language-server: $schema=./schemas/settings.schema.json

# Homepage Lite Settings
title: Liteda

# Theme: light, dark, or auto
theme: dark

# Background (optional)
background:
  image: https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1920
  opacity: 0.3
  blur: 2

# Layout
layout:
  columns: 3
  style: grid
  # Header gadgets with group support
  header:
    # Left group (center-aligned, items distributed)
    - type: group
      vars:
        align: center # left, center, right
        items:
          - type: resources
            vars:
              cpu: true
              memory: true
              disk: /
              cputemp: true
              refresh: 10000
    # Spacer pushes items to right
    - type: spacer
    # Right group (right-aligned)
    - type: group
      vars:
        align: center # left, center, right
        items:
          - type: weather
            vars:
              latitude: 25.0330
              longitude: 121.5654
              label: "Taipei"
              units: metric
              refresh: 600000
          - type: search
          - type: theme-switcher

# Pages (optional - if not set, services.yaml is used as single page)
pages:
  - id: home
    name: Home
    icon: home
    file: services.yaml
  - id: media
    name: Media
    icon: play
    file: pages/media.yaml
  - id: infra
    name: Infrastructure
    icon: server
    file: pages/infra.yaml
  - id: notes
    name: Notes
    icon: folder
    file: pages/notes.md

# Features (optional)
features:
  example-feature:
    enabled: true
    vars:
      groupName: "Example Feature Services"
      groupIcon: "docker"
  docker-discovery:
    enabled: true
    vars:
      socketPath: /var/run/docker.sock
      targetPages:
        - home
      groupName: "Docker Containers"
      groupIcon: "docker"
      refreshInterval: 30000
      columns: 3
      # includeLabels:
      #   - liteda.enable=true
      # excludeLabels:
      #   - liteda.hide=true

# Custom CSS (optional)
# customCss: |
#   .custom-class { color: red; }
