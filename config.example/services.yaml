# yaml-language-server: $schema=./schemas/services.schema.json

# Home Page Services

# Example: Service group with items
- name: Quick Access
  columns: 2
  items:
    - name: Portainer
      icon: portainer
      url: https://portainer.local
      description: Container management
      # Example: Multiple functional areas
      links:
        - name: Containers
          url: https://portainer.local/#!/2/docker/containers
        - name: Images
          url: https://portainer.local/#!/2/docker/images
        - name: Networks
          url: https://portainer.local/#!/2/docker/networks
        - name: Volumes
          url: https://portainer.local/#!/2/docker/volumes
      # Uncomment to add live widget
      # widget:
      #   type: portainer
      #   interval: 10000
      #   vars:
      #     url: https://portainer.local
      #     key: "your-api-key"
      #     env: 1

    - name: Proxmox
      icon: proxmox
      url: https://pve.local
      description: Virtualization platform
      # Example: Multiple sub-links for quick access
      links:
        - name: Node 1
          url: https://pve.local:8006/#v1:0:=node/pve1
        - name: Node 2
          url: https://pve.local:8006/#v1:0:=node/pve2
        - name: Backups
          url: https://pve.local:8006/#v1:0:=storage/local/content
          icon: database

    - name: Grafana
      icon: grafana
      url: https://grafana.local
      description: Metrics dashboard

    - name: Jellyfin
      icon: jellyfin
      url: https://jellyfin.local
      description: Media server
      # Example: Links with custom icons
      links:
        - name: Movies
          url: https://jellyfin.local/web/index.html#!/movies.html
          icon: film
        - name: TV Shows
          url: https://jellyfin.local/web/index.html#!/tv.html
          icon: tv
        - name: Music
          url: https://jellyfin.local/web/index.html#!/music.html
          icon: music

# Example: Nested groups
- name: Infrastructure
  icon: server
  columns: 2
  groups:
    - name: Monitoring
      items:
        - name: Uptime Kuma
          icon: uptime-kuma
          url: https://uptime.local
          description: Uptime monitoring
        
        - name: Prometheus
          icon: prometheus
          url: https://prometheus.local
          description: Monitoring system

    - name: Network
      items:
        - name: Nginx Proxy Manager
          icon: nginx-proxy-manager
          url: https://npm.local
          description: Reverse proxy
        
        - name: Cloudflared
          icon: cloudflare
          url: https://cloudflare.local
          description: Tunnel manager

# Example: Bookmarks (compact tags style)
- name: Quick Links
  type: bookmarks
  items:
    - name: Google
      url: https://google.com
      icon: google
    
    - name: GitHub
      url: https://github.com
      icon: github
    
    - name: YouTube
      url: https://youtube.com
      icon: youtube
    
    - name: Reddit
      url: https://reddit.com
      icon: reddit
